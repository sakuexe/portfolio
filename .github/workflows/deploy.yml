name: Deploy website

# Builds the site and deploys it to Cloudflare Workers.
# Runs on pushes to main that touch website/, or by hand.
on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

# Queue instead of cancel: one run active, the newest one pending
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Holds the build config and Cloudflare values; only main may deploy.
    environment:
      name: astro-build
      url: https://sakukarttunen.com
    defaults:
      run:
        working-directory: website
    # Public astro:env values, inlined at build time. astro check validates
    # them too, so they're set for the whole job.
    env:
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      # An unset var expands to "", which astro:env rejects instead of
      # falling back to the schema default.
      SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      MAIL_TO: ${{ vars.MAIL_TO }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      - name: Check
        run: npx astro check

      - name: Build
        run: npm run build

      # Finds the generated config through .wrangler/deploy/config.json.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
